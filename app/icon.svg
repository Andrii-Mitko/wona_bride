<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Elegant gold gradient matching the logo -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="30%" stop-color="#C5A075" />
      <stop offset="70%" stop-color="#A37F55" />
      <stop offset="100%" stop-color="#8B6C43" />
    </linearGradient>

    <style>
      .bg-circle {
        fill: #FDF7F2;
        stroke: url(#goldGradient);
        stroke-width: 8;
      }

      .monogram {
        font-family: "Cinzel", "Didot", "Bodoni MT", "Times New Roman", serif;
        font-weight: 400;
        fill: url(#goldGradient);
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Outer circle -->
  <circle cx="256" cy="256" r="240" class="bg-circle" />

  <!-- Inner elegant ring -->
  <circle
    cx="256"
    cy="256"
    r="230"
    fill="none"
    stroke="url(#goldGradient)"
    stroke-width="2"
    opacity="0.7"
  />

  <!-- WB -->
  <text
    x="256"
    y="260"
    font-size="260"
    letter-spacing="-18"
    class="monogram"
  >
    WB
  </text>
</svg>